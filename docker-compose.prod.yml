version: '3.8'

services:
  # Production Redis for multi-instance nonce coordination
  redis:
    image: redis:7-alpine
    container_name: zkdefi-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zkdefi-network

  # Starknet Relayer Service
  relayer:
    image: obsqra/starknet-relayer:latest
    container_name: zkdefi-relayer
    ports:
      - "8004:8004"
    environment:
      - STARKNET_RPC_URL=${STARKNET_RPC_URL:-https://free-rpc.nethermind.io/sepolia-juno}
      - RELAYER_PORT=8004
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zkdefi-network

  # Backend API Service (Phase 2-4)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zkdefi-backend
    ports:
      - "8003:8003"
    environment:
      - RELAYER_URL=http://relayer:8004
      - REDIS_URL=redis://${REDIS_PASSWORD:+:${REDIS_PASSWORD}@}redis:6379
      - DATABASE_URL=sqlite:///data/executions.db
      - LOG_LEVEL=info
    volumes:
      - backend_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      relayer:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - zkdefi-network

  # Frontend Service (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: zkdefi-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8003
      - BACKEND_API_URL=http://backend:8003
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - zkdefi-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: zkdefi-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - zkdefi-network

volumes:
  redis_data:
  backend_data:

networks:
  zkdefi-network:
    driver: bridge
