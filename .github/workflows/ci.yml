name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conflict-safe-guard:
    name: Conflict-Safe Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce no-touch path set
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: ./scripts/check_conflict_safe_paths.sh

  backend-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    needs: conflict-safe-guard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest httpx

      - name: Run backend tests
        run: make test-backend

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: conflict-safe-guard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install & build
        run: make build-frontend

  showcase-gate:
    name: Showcase Gate (Path B + Strict Bridge)
    runs-on: ubuntu-latest
    needs: conflict-safe-guard
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest httpx

      - name: Start backend API
        working-directory: backend
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8003 >/tmp/zkdefi-backend.log 2>&1 &
          echo $! >/tmp/zkdefi-backend.pid
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:8003/health >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8003/health

      - name: Run showcase gate
        env:
          SHOWCASE_BASE_URL: http://127.0.0.1:8003
          SHOWCASE_TIMEOUT_SECONDS: "50"
          PATHB_WARM_MIN_COVERAGE: "1.0"
        run: make showcase-gate

      - name: Upload showcase artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hackathon-showcase-artifacts
          path: artifacts/hackathon_showcase/
          if-no-files-found: ignore

      - name: Dump backend log on failure
        if: failure()
        run: |
          echo "=== backend log (tail) ==="
          tail -n 400 /tmp/zkdefi-backend.log || true

      - name: Stop backend API
        if: always()
        run: |
          if [ -f /tmp/zkdefi-backend.pid ]; then
            kill "$(cat /tmp/zkdefi-backend.pid)" || true
          fi
