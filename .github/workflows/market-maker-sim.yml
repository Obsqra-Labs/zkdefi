# Sepolia Ekubo market-maker-sim: tests + Docker image build
name: Market maker sim

on:
  push:
    branches: [main]
    paths:
      - "market-maker-sim/**"
      - ".github/workflows/market-maker-sim.yml"
  pull_request:
    branches: [main]
    paths:
      - "market-maker-sim/**"
      - ".github/workflows/market-maker-sim.yml"

concurrency:
  group: mm-sim-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: market-maker-sim
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: market-maker-sim/requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        env:
          FLEET_ENABLED: "false"
          BOT_ACCOUNT_ADDRESS: ""
          BOT_PRIVATE_KEY: ""
          MM_SIM_ADMIN_KEY: dev-admin-key
        run: |
          export PYTHONPATH="$PWD"
          pytest tests/ -q --tb=short

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t obsqra/market-maker-sim:ci ./market-maker-sim

  js-client:
    name: JS client sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: node --check
        working-directory: market-maker-sim/clients/js
        run: node --check index.js
